<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracker</title>
  <!-- daisyui & tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: "Geist", sans-serif;
    }
  </style> <!-- daisyui & tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- cdn -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: "Geist", sans-serif;
    }
  </style>
</head>

<body>
  <!-- navbar section -->
  <div class="bg-black shadow p-4  flex justify-between items-center">
    <div class="flex gap-3 justify-center items-center">
      <img class="w-10 invert" src="./assets/github-logo.png" alt="">
      <h1 class=" text-xl font-bold text-white">GitHub Issues Tracker</h1>
    </div>
    <section class="flex justify-center">
      <div class="join">
        <div>
          <label class="input validator join-item">

            <input id="input-search" type="text" placeholder="Search issue..." required />
          </label>
        </div>
        <button id="btn-search" class="btn btn-primary join-item">search</button>
      </div>
    </section>
  </div>
  <!-- main section  -->
  <main class="my-5">
    <!-- section 01 -->
    <section class="flex gap-6 p-5 w-10/12 mx-auto bg-emerald-200 shadow-md rounded-md">
      <button id="all-btn" onclick="displayAll(allIssues)" class="btn btn-primary px-10 text-white">All</button>

      <button id="open-btn" onclick="showOpen()" class="btn  btn-outline px-10 text-neutral-500">Open</button>

      <button id="closed-btn" onclick="showClosed()" class="btn  btn-outline px-10 text-neutral-500">Closed</button>
    </section>
    <!-- issues section -->
    <section class="p-5 w-10/12 mx-auto bg-emerald-200 shadow-md rounded-md mt-3">
      <div class="flex justify-between items-center">
        <div class="flex gap-2 items-center">
          <img class="" src="./assets/Aperture.png" alt="">
          <div>
            <h4 id="issue-count" class="font-bold text-[15px]">0 Issues</h4>
            <p class="text-sm text-neutral-500">Track and manage your project issues</p>
          </div>
        </div>
        <div class="flex gap-3 items-center">
          <p class="font-semibold text-neutral-700">
          <div class="badge bg-[#00A96E] badge-xs"></div> Open</p>
          <p class="font-semibold text-neutral-700">
          <div class="badge bg-[#A855F7] badge-xs"></div> Closed</p>
        </div>
      </div>
    </section>
    <!-- all card section -->
    <div id="all-card" class="mt-5 w-10/12 mx-auto  grid lg:grid-cols-4 md:grid-cols-3 sm:grid-cols-2 gap-4  bg-white shadow shadow-slate-300 p-4">



    </div>

    <!-- modal -->

    <dialog id="issue-modal" class="modal">
      <div class="modal-box w-11/12 max-w-2xl">

        <h3 id="modal-title" class="text-xl font-bold"></h3>

        <p id="modal-meta" class="text-sm text-gray-500 mt-2"></p>

        <div class="flex gap-2 mt-3">
          <span id="modal-label1" class="badge badge-error"></span>
          <span id="modal-label2" class="badge badge-warning"></span>
        </div>

        <p id="modal-description" class="mt-4 text-gray-600"></p>

        <div class="bg-gray-100 p-4 rounded-lg mt-4 flex justify-between">
          <div>
            <p class="text-sm text-gray-500">Assignee:sabbir hossain</p>
            <p id="modal-assignee" class="font-semibold"></p>
          </div>

          <div>
            <p class="text-sm text-gray-500">Priority:</p>
            <p id="modal-priority" class="badge badge-error"></p>
          </div>
        </div>

        <div class="modal-action">
          <button onclick="closeModal()" class="btn btn-primary">Close</button>
        </div>

      </div>
    </dialog>
  </main>
  <script src="./index.js"></script>
</body>

</html>
